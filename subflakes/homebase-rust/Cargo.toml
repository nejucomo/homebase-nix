[workspace]
resolver = "3"
members = [
  "homebase-nix",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.metadata.crane]
name = "homebase-rust-workspace"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.dependencies]
yaffa = "0.1.1"
clap = "4.6.7"
regex = "1"
serde = "1"
serde_json = "1"
